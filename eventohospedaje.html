<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2d5a46">
    <title>Contrato de Arrendamiento y Hospedaje</title>
    
    <!-- Fuentes de Quinta Bugambilia -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- SISTEMA DE DISEÑO DE QUINTA BUGAMBILIA --- */
        :root {
            --bg: #efe8da;
            --card: #fbfbf8;
            --mar: linear-gradient(135deg, #fff 0%, #f3f3ef 55%, #fcfcfa 100%);
            --ink: #2d5a46;
            --text: #3a4043;
            --muted: #7b8080;
            --line: #e2dac9;
            --wood: #9a6b45;
            --wood2: #f1e3d3;
            --blue: #2f6690;
            --blue2: #dde9f3;
            --ok: #2d5a46;
            --ok2: #dcebe2;
            --bad: #a8432f;
            --bad2: #f6dfd8;
            --sh: 0 2px 10px rgba(58,64,67,.08);
        }
        
        /* Soporte Automático para Modo Oscuro */
        :root[data-theme=dark] {
            --bg: #121815;
            --card: #1b2420;
            --mar: linear-gradient(135deg, #202b26, #1b2420);
            --ink: #7fc4a0;
            --text: #dde5e0;
            --muted: #92a09a;
            --line: #2c3833;
            --wood: #d3a073;
            --wood2: #3a2d21;
            --blue: #7fb2dc;
            --blue2: #1d2c3a;
            --ok: #7fc4a0;
            --ok2: #1c3228;
            --bad: #f0907c;
            --bad2: #3a211b;
            --sh: none;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        html { background: var(--bg); }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            max-width: 520px; /* Ancho máximo de la WebApp */
            margin: 0 auto;
            min-height: 100vh;
            padding: 20px 14px 40px;
            font-size: 15px;
        }

        h1, h2, h3, .serif { font-family: 'Fraunces', serif; }
        
        /* --- ESTILOS DE CAMPOS DE TEXTO --- */
        input, select {
            font-family: inherit;
            font-size: 16px;
            color: var(--text);
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--card);
            transition: outline 0.2s;
        }
        :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

        /* --- CLASES DE ESTRUCTURA Y FORMULARIO --- */
        .sheet {
            background: var(--card);
            width: 100%;
            border-radius: 26px;
            padding: 24px 18px;
            box-shadow: var(--sh);
            border: 1px solid var(--line);
        }

        .sh { text-align: center; margin-bottom: 20px; }
        .sh h3 { font-size: 24px; color: var(--ink); margin-bottom: 6px; }
        .sh p { font-size: 13px; color: var(--muted); }

        .fs {
            font-size: 12px;
            font-weight: 700;
            color: var(--wood);
            margin: 20px 0 10px;
            text-transform: uppercase;
            letter-spacing: .5px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 6px;
        }

        .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .f { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .f label { font-size: 13px; font-weight: 500; color: var(--text); }
        .f input[readonly] { background: var(--bg); font-weight: 700; }

        /* --- BOTONES --- */
        .foot { display: flex; gap: 10px; margin-top: 24px; }
        .btn {
            flex: 1;
            min-height: 50px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border: 0;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active { transform: scale(0.98); }
        .b1 { background: var(--ink); color: var(--card); }
    </style>
</head>
<body>

    <!-- Contenedor principal tipo Modal/Sheet -->
    <div class="sheet">
        
        <div class="sh">
            <h3>Contrato de Arrendamiento</h3>
            <p>Panel integral de control de reservas y hospedaje</p>
        </div>

        <form action="#" method="POST">

            <!-- SECCIÓN: CLIENTE -->
            <div class="fs">Cliente</div>
            <div class="f">
                <label>Nombre del Cliente Arrendatario</label>
                <input type="text" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="g2">
                <div class="f">
                    <label>Identificación Oficial</label>
                    <input type="text" placeholder="INE o Pasaporte">
                </div>
                <div class="f">
                    <label>Teléfono</label>
                    <input type="tel" inputmode="tel" placeholder="662 000 0000">
                </div>
            </div>

            <div class="f">
                <label>Domicilio del Cliente</label>
                <input type="text" placeholder="Calle, número, colonia, ciudad">
            </div>

            <!-- SECCIÓN: FECHAS -->
            <div class="fs">Fechas y horarios</div>
            <div class="g2">
                <div class="f">
                    <label>Entrada (Check-In)</label>
                    <input type="date">
                </div>
                <div class="f">
                    <label>Hora de Entrada</label>
                    <input type="time" value="15:00">
                </div>
            </div>

            <div class="g2">
                <div class="f">
                    <label>Salida (Check-Out)</label>
                    <input type="date">
                </div>
                <div class="f">
                    <label>Hora de Salida</label>
                    <input type="time" value="12:00">
                </div>
            </div>

            <!-- SECCIÓN: HOSPEDAJE -->
            <div class="fs">Hospedaje por noche</div>
            <div class="g2">
                <div class="f">
                    <label>Tarifa base por noche ($)</label>
                    <input type="number" inputmode="decimal" step="0.01" placeholder="0.00">
                </div>
                <div class="f">
                    <label>Noches</label>
                    <input type="number" inputmode="numeric" placeholder="0">
                </div>
            </div>

            <!-- BOTÓN DE ACCIÓN -->
            <div class="foot">
                <button type="submit" class="btn b1">
                    <i class="fas fa-file-signature"></i> Generar Contrato
                </button>
            </div>

        </form>
    </div>

</body>
</html>
