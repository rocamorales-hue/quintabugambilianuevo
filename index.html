<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión | Rentas</title>
    <style>
        :root {
            /* Paleta de Colores Solicitada */
            --blanco: #ffffff;
            --verde-natural: #2A5C38;  /* Tono jardín/naturaleza */
            --azul-agua: #3498db;      /* Tono alberca/fresco */
            --gris-fuerte: #2c3e50;    /* Textos y contrastes */
            --madera: #8b5a2b;         /* Detalles rústicos/calidez */
            --travertino: #e0d5c1;     /* Tonos cálidos de piedra */
            --marmol-bg: #f7f9fa;      /* Fondo claro con sensación limpia */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--marmol-bg);
            background-image: radial-gradient(var(--travertino) 1px, transparent 1px);
            background-size: 40px 40px; /* Textura sutil estilo piedra */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gris-fuerte);
        }

        .dashboard-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px); /* Efecto Glassmorphism / Mármol pulido */
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(44, 62, 80, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--verde-natural);
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-rentas {
            background-color: var(--verde-natural);
            color: var(--blanco);
            box-shadow: 0 4px 15px rgba(42, 92, 56, 0.2);
        }

        .btn-rentas:hover {
            background-color: var(--madera); /* Transición a tono cálido */
            transform: translateY(-2px);
        }

        .btn-reembolsos {
            background-color: var(--blanco);
            color: var(--gris-fuerte);
            border: 2px solid var(--travertino);
        }

        .btn-reembolsos:hover {
            border-color: var(--azul-agua);
            color: var(--azul-agua);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <h1>Panel de Administración</h1>
        <div class="btn-container">
            <!-- Apunta a tu sistema actual de rentas -->
            <a href="rentas.html" class="btn btn-rentas">Gestión de Rentas</a>
            <!-- Apunta al archivo en tu repositorio -->
            <a href="reembolsos.html" class="btn btn-reembolsos">Procesar Reembolsos</a>
        </div>
    </div>

</body>
</html>
