<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión | Rentas</title>
    <style>
        :root {
            /* Paleta de Colores Solicitada */
            --blanco: #ffffff;
            --verde-natural: #2A5C38;  /* Tono jardín/naturaleza */
            --azul-agua: #3498db;      /* Tono alberca/fresco */
            --gris-fuerte: #2c3e50;    /* Textos y contrastes */
            --madera: #8b5a2b;         /* Detalles rústicos/calidez */
            --travertino: #e0d5c1;     /* Tonos cálidos de piedra */
            --marmol-bg: #f7f9fa;      /* Fondo claro con sensación limpia */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--marmol-bg);
            background-image: radial-gradient(var(--travertino) 1px, transparent 1px);
            background-size: 40px 40px; /* Textura sutil estilo piedra */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gris-fuerte);
        }

        .dashboard-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px); /* Efecto Glassmorphism / Mármol pulido */
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(44, 62, 80, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--verde-natural);
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .btn-rentas {
            background-color: var(--verde-natural);
            color: var(--blanco);
            box-shadow: 0 4px 15px rgba(42, 92, 56, 0.2);
        }

        .btn-rentas:hover {
            background-color: var(--madera); /* Transición a tono cálido */
            transform: translateY(-2px);
        }

        .btn-reembolsos {
            background-color: var(--blanco);
            color: var(--gris-fuerte);
            border: 2px solid var(--travertino);
        }

        .btn-reembolsos:hover {
            border-color: var(--azul-agua);
            color: var(--azul-agua);
            transform: translateY(-2px);
        }

        /* --- NUEVOS ESTILOS PARA CONTRATOS --- */
        .btn-contratos {
            background-color: var(--azul-agua);
            color: var(--blanco);
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.2);
        }

        .btn-contratos:hover {
            background-color: var(--gris-fuerte);
            transform: translateY(-2px);
        }

        .dropdown {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .dropdown-content {
            display: none;
            flex-direction: column;
            background-color: var(--blanco);
            margin-top: 0.5rem;
            border-radius: 8px;
            border: 1px solid var(--travertino);
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
            overflow: hidden;
            animation: fadeIn 0.3s ease;
        }

        .dropdown-content a {
            color: var(--gris-fuerte);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
            font-weight: 500;
            border-bottom: 1px solid var(--marmol-bg);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .dropdown-content a:last-child {
            border-bottom: none;
        }

        .dropdown-content a:hover {
            background-color: var(--marmol-bg);
            color: var(--verde-natural);
            padding-left: 20px; /* Pequeño efecto visual al pasar el mouse */
        }

        .show {
            display: flex;
        }

        /* Animación para el menú */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <h1>Panel de Administración</h1>
        <div class="btn-container">
            
            <!-- Botón original de Rentas -->
            <a href="rentas.html" class="btn btn-rentas">Gestión de Rentas</a>
            
            <!-- NUEVO: Contenedor Dropdown para Contratos -->
            <div class="dropdown">
                <button onclick="toggleContratos()" class="btn btn-contratos">
                    Contratos ▾
                </button>
                <div id="menuContratos" class="dropdown-content">
                    <a href="#hospedaje">Hospedaje</a>
                    <a href="#evento">Evento</a>
                    <a href="eventohospedaje.html">Evento con Hospedaje</a>
                </div>
            </div>

            <!-- Botón original de Reembolsos -->
            <a href="reembolsos.html" class="btn btn-reembolsos">Procesar Reembolsos</a>
            
        </div>
    </div>

    <!-- Script para el funcionamiento del menú desplegable -->
    <script>
        function toggleContratos() {
            document.getElementById("menuContratos").classList.toggle("show");
        }

        // Cierra el menú si el usuario hace clic fuera de él
        window.onclick = function(event) {
            if (!event.target.matches('.btn-contratos')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>
</body>
</html>
