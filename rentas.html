<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gestión de Rentas Premium</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-green': '#2e7d5b',
                        'brand-wood': '#8b5a2b',
                        'brand-wood-light': '#a67345',
                        'brand-blue': '#2563eb',
                        'brand-blue-hover': '#1d4ed8',
                        'brand-gray': '#374151',
                        'brand-gray-light': '#6b7280',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'floating': '0 10px 40px -10px rgba(0,0,0,0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Styles & Textures */
        body {
            background-color: #ffffff; /* Blanco limpio como fondo base */
            color: #374151; /* Gris fuerte */
        }
        
        /* Efecto Travertino / Mármol para tarjetas */
        .bg-marble {
            background: linear-gradient(135deg, #fdfbf7 0%, #f4efe6 100%);
            border: 1px solid #e8e3d8;
            position: relative;
            z-index: 1;
        }
        .bg-marble::before {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0.4;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
            mix-blend-mode: multiply;
            border-radius: inherit;
            z-index: -1;
            pointer-events: none;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Animations */
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* View transitions */
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.4s ease-out; }

        /* Calendar Grid */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 0.5rem;
        }
        .cal-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            border: 1px solid #e5e7eb;
        }
        .cal-day:hover {
            border-color: #2563eb; /* Blue hover */
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }
        .cal-day.active-day {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .cal-day.has-event::after {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #2e7d5b; /* Green accent */
            border-radius: 50%;
            margin-top: 4px;
        }
    </style>
</head>
<body class="antialiased flex h-screen overflow-hidden">

    <!-- Sidebar / Navigation -->
    <aside class="w-20 lg:w-64 flex flex-col bg-marble shadow-soft z-20 border-r border-[#e8e3d8] transition-all duration-300">
        <div class="h-20 flex items-center justify-center lg:justify-start lg:px-6 border-b border-[#e8e3d8]">
            <div class="w-10 h-10 rounded-xl bg-brand-green flex items-center justify-center text-white shadow-lg">
                <i class="fa-solid fa-leaf text-xl"></i>
            </div>
            <span class="hidden lg:block ml-3 font-serif font-bold text-xl text-brand-gray tracking-tight">Quinta<br><span class="text-brand-green text-sm">Resorts</span></span>
        </div>
        
        <nav class="flex-1 py-6 flex flex-col gap-2 px-3">
            <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center p-3 rounded-xl transition-all duration-200 text-brand-blue bg-blue-50">
                <i class="fa-solid fa-chart-pie w-6 text-center text-lg"></i>
                <span class="hidden lg:block ml-3 font-medium text-sm">Dashboard</span>
            </button>
            <button onclick="navigate('reservations')" id="nav-reservations" class="nav-btn w-full flex items-center p-3 rounded-xl transition-all duration-200 text-brand-gray hover:bg-gray-50">
                <i class="fa-solid fa-list w-6 text-center text-lg"></i>
                <span class="hidden lg:block ml-3 font-medium text-sm">Reservaciones</span>
            </button>
            <button onclick="navigate('calendar')" id="nav-calendar" class="nav-btn w-full flex items-center p-3 rounded-xl transition-all duration-200 text-brand-gray hover:bg-gray-50">
                <i class="fa-regular fa-calendar-days w-6 text-center text-lg"></i>
                <span class="hidden lg:block ml-3 font-medium text-sm">Calendario</span>
            </button>
        </nav>

        <div class="p-4 border-t border-[#e8e3d8]">
            <button class="w-full flex items-center justify-center lg:justify-start p-2 rounded-xl text-brand-wood hover:bg-[#8b5a2b] hover:text-white transition-colors border border-transparent hover:border-[#8b5a2b]">
                <i class="fa-solid fa-gear w-6 text-center"></i>
                <span class="hidden lg:block ml-2 text-sm font-medium">Ajustes</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full bg-[#faf9f6] relative overflow-hidden">
        
        <!-- Header -->
        <header class="h-20 px-8 flex items-center justify-between bg-white/80 backdrop-blur-md border-b border-gray-100 z-10 sticky top-0">
            <div>
                <h2 id="page-title" class="text-2xl font-serif font-bold text-brand-gray">Resumen General</h2>
                <p class="text-sm text-brand-gray-light mt-0.5" id="current-date"></p>
            </div>
            <div class="flex items-center gap-4">
                <button class="w-10 h-10 rounded-full bg-white border border-gray-200 flex items-center justify-center text-brand-gray hover:text-brand-blue shadow-sm transition-colors">
                    <i class="fa-regular fa-bell"></i>
                </button>
                <button onclick="openModal()" class="px-5 py-2.5 bg-brand-blue hover:bg-brand-blue-hover text-white rounded-xl font-medium shadow-md shadow-blue-500/20 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Nueva Renta
                </button>
            </div>
        </header>

        <!-- Scrollable Area -->
        <div class="flex-1 overflow-y-auto p-8">
            
            <!-- VIEW: DASHBOARD -->
            <div id="view-dashboard" class="view-section active space-y-8 max-w-6xl mx-auto">
                <!-- KPIs -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-marble rounded-2xl p-6 shadow-soft">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-sm font-medium text-brand-wood uppercase tracking-wider">Total Ventas (Mes)</p>
                                <h3 class="text-3xl font-bold text-brand-gray mt-2">$124,500</h3>
                            </div>
                            <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center text-brand-wood shadow-sm">
                                <i class="fa-solid fa-vault text-xl"></i>
                            </div>
                        </div>
                        <div class="mt-4 flex items-center text-sm">
                            <span class="text-brand-green font-medium flex items-center"><i class="fa-solid fa-arrow-trend-up mr-1"></i> +12%</span>
                            <span class="text-brand-gray-light ml-2">vs mes anterior</span>
                        </div>
                    </div>

                    <div class="bg-marble rounded-2xl p-6 shadow-soft">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-sm font-medium text-brand-green uppercase tracking-wider">Cobrado</p>
                                <h3 class="text-3xl font-bold text-brand-gray mt-2">$89,200</h3>
                            </div>
                            <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center text-brand-green shadow-sm">
                                <i class="fa-solid fa-hand-holding-dollar text-xl"></i>
                            </div>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-1.5 mt-5">
                            <div class="bg-brand-green h-1.5 rounded-full" style="width: 71%"></div>
                        </div>
                    </div>

                    <div class="bg-marble rounded-2xl p-6 shadow-soft border-l-4 border-l-orange-400">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-sm font-medium text-brand-gray-light uppercase tracking-wider">Por Cobrar (Saldo)</p>
                                <h3 class="text-3xl font-bold text-brand-gray mt-2">$35,300</h3>
                            </div>
                            <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center text-orange-500 shadow-sm">
                                <i class="fa-regular fa-clock text-xl"></i>
                            </div>
                        </div>
                        <p class="text-sm text-brand-gray-light mt-4">De 8 reservaciones activas</p>
                    </div>
                </div>

                <!-- Próximos Eventos Mini -->
                <div>
                    <h3 class="text-lg font-serif font-bold text-brand-gray mb-4">Próximos Eventos (7 días)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="dashboard-events">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

            <!-- VIEW: RESERVATIONS LIST -->
            <div id="view-reservations" class="view-section space-y-6 max-w-6xl mx-auto">
                <!-- Filters -->
                <div class="bg-white p-4 rounded-2xl shadow-soft border border-gray-100 flex flex-col md:flex-row gap-4 items-center justify-between">
                    <div class="relative w-full md:w-96">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" placeholder="Buscar cliente, folio o área..." class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-blue/50 focus:border-brand-blue text-sm transition-all">
                    </div>
                    <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 hide-scrollbar">
                        <button class="px-4 py-2 rounded-lg bg-brand-gray text-white text-sm font-medium whitespace-nowrap">Todos</button>
                        <button class="px-4 py-2 rounded-lg bg-white border border-gray-200 text-brand-gray hover:bg-gray-50 text-sm font-medium whitespace-nowrap">Con Saldo</button>
                        <button class="px-4 py-2 rounded-lg bg-white border border-gray-200 text-brand-gray hover:bg-gray-50 text-sm font-medium whitespace-nowrap">Liquidados</button>
                    </div>
                </div>

                <!-- List Grid -->
                <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6" id="reservations-grid">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- VIEW: CALENDAR -->
            <div id="view-calendar" class="view-section max-w-5xl mx-auto">
                <div class="bg-marble rounded-3xl p-6 md:p-8 shadow-soft">
                    <div class="flex items-center justify-between mb-8">
                        <h3 class="text-2xl font-serif font-bold text-brand-gray" id="cal-month-year">Octubre 2026</h3>
                        <div class="flex gap-2">
                            <button class="w-10 h-10 rounded-xl bg-white border border-gray-200 text-brand-gray hover:border-brand-blue hover:text-brand-blue transition-colors flex items-center justify-center">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>
                            <button class="w-10 h-10 rounded-xl bg-white border border-gray-200 text-brand-gray hover:border-brand-blue hover:text-brand-blue transition-colors flex items-center justify-center">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="cal-grid text-center mb-4">
                        <div class="text-xs font-bold text-brand-gray-light uppercase tracking-wider">Dom</div>
                        <div class="text-xs font-bold text-brand-gray-light uppercase tracking-wider">Lun</div>
                        <div class="text-xs font-bold text-brand-gray-light uppercase tracking-wider">Mar</div>
                        <div class="text-xs font-bold text-brand-gray-light uppercase tracking-wider">Mié</div>
                        <div class="text-xs font-bold text-brand-gray-light uppercase tracking-wider">Jue</div>
                        <div class="text-xs font-bold text-brand-gray-light uppercase tracking-wider">Vie</div>
                        <div class="text-xs font-bold text-brand-gray-light uppercase tracking-wider">Sáb</div>
                    </div>
                    
                    <div class="cal-grid" id="calendar-days">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal Form (Hidden by default) -->
    <div id="modal-form" class="fixed inset-0 bg-brand-gray/40 backdrop-blur-sm z-50 hidden items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl shadow-floating w-full max-w-2xl overflow-hidden transform scale-95 transition-transform duration-300" id="modal-content">
            <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center bg-marble">
                <h3 class="font-serif font-bold text-xl text-brand-gray">Nueva Reservación</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white text-gray-400 hover:text-gray-800 flex items-center justify-center shadow-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-6 max-h-[70vh] overflow-y-auto">
                <div class="space-y-5">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Cliente</label>
                            <input type="text" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-blue/50 outline-none text-sm" placeholder="Nombre completo">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Teléfono</label>
                            <input type="tel" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-blue/50 outline-none text-sm" placeholder="10 dígitos">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Fecha</label>
                            <input type="date" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-blue/50 outline-none text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Áreas</label>
                            <select class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-brand-blue/50 outline-none text-sm">
                                <option>Local Completo</option>
                                <option>Solo Alberca + Asador</option>
                                <option>Salón Principal</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-4 border-t border-gray-100 pt-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Total ($)</label>
                            <input type="number" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-sm font-bold text-brand-gray" value="0">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Anticipo ($)</label>
                            <input type="number" class="w-full p-3 bg-white border border-gray-200 rounded-xl text-sm text-brand-green" value="0">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Saldo ($)</label>
                            <input type="number" readonly class="w-full p-3 bg-gray-100 border border-transparent rounded-xl text-sm text-orange-600 font-bold" value="0">
                        </div>
                    </div>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl border border-[#8b5a2b] text-[#8b5a2b] hover:bg-[#8b5a2b] hover:text-white text-sm font-medium transition-colors">Cancelar</button>
                <button onclick="saveMock()" class="px-6 py-2.5 rounded-xl bg-brand-blue hover:bg-brand-blue-hover text-white text-sm font-medium shadow-md transition-colors">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-brand-gray text-white px-6 py-3 rounded-full shadow-floating flex items-center gap-3 transition-all duration-300 translate-y-20 opacity-0 z-50">
        <i class="fa-solid fa-circle-check text-brand-green"></i>
        <span class="text-sm font-medium" id="toast-msg">Acción exitosa</span>
    </div>

    <script>
        // Mock Data
        const reservations = [
            { id: 'FOL-001', name: 'Familia González', date: '2026-10-18', areas: ['Alberca', 'Asador'], total: 8500, paid: 4000, balance: 4500, status: 'saldo' },
            { id: 'FOL-002', name: 'Empresa XYZ', date: '2026-10-20', areas: ['Local Completo'], total: 15000, paid: 15000, balance: 0, status: 'liquidado' },
            { id: 'FOL-003', name: 'Boda Civil Martínez', date: '2026-10-24', areas: ['Salón', 'Jardín'], total: 22000, paid: 10000, balance: 12000, status: 'saldo' },
            { id: 'FOL-004', name: 'Cumpleaños Infantil', date: '2026-10-15', areas: ['Alberca', 'Cuarto de Juegos'], total: 6000, paid: 6000, balance: 0, status: 'liquidado' }
        ];

        // Format Utilities
        const formatMoney = (amount) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(amount);
        const formatDate = (dateStr) => {
            const options = { weekday: 'long', day: 'numeric', month: 'short' };
            const d = new Date(dateStr + 'T12:00:00'); // Prevent timezone shift
            let str = d.toLocaleDateString('es-MX', options);
            return str.charAt(0).toUpperCase() + str.slice(1);
        };

        // Navigation
        function navigate(view) {
            // Update buttons
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-brand-blue', 'bg-blue-50');
                btn.classList.add('text-brand-gray', 'hover:bg-gray-50');
            });
            const activeBtn = document.getElementById(`nav-${view}`);
            activeBtn.classList.remove('text-brand-gray', 'hover:bg-gray-50');
            activeBtn.classList.add('text-brand-blue', 'bg-blue-50');

            // Update views
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(`view-${view}`).classList.add('active');

            // Update Header
            const titles = {
                'dashboard': 'Resumen General',
                'reservations': 'Lista de Reservaciones',
                'calendar': 'Calendario de Ocupación'
            };
            document.getElementById('page-title').textContent = titles[view];
        }

        // Render Data
        function renderDashboard() {
            const container = document.getElementById('dashboard-events');
            const upcoming = reservations.filter(r => r.balance > 0).slice(0, 2); // Just mock logic
            
            container.innerHTML = upcoming.map(r => `
                <div class="bg-white border border-gray-100 rounded-2xl p-5 shadow-sm flex items-center justify-between hover:shadow-md transition-shadow">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-xl bg-blue-50 flex flex-col items-center justify-center text-brand-blue">
                            <span class="text-xs font-bold uppercase">${new Date(r.date).toLocaleDateString('es', {month: 'short'})}</span>
                            <span class="text-lg font-black leading-none">${new Date(r.date).getDate()}</span>
                        </div>
                        <div>
                            <h4 class="font-bold text-brand-gray text-sm">${r.name}</h4>
                            <p class="text-xs text-brand-gray-light mt-0.5"><i class="fa-solid fa-layer-group mr-1"></i> ${r.areas.join(' • ')}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="inline-block px-3 py-1 rounded-full text-xs font-bold ${r.status === 'liquidado' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}">
                            ${r.status === 'liquidado' ? 'Liquidado' : 'Debe ' + formatMoney(r.balance)}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        function renderReservations() {
            const grid = document.getElementById('reservations-grid');
            grid.innerHTML = reservations.map(r => `
                <div class="bg-marble rounded-2xl p-6 shadow-soft hover:shadow-floating transition-shadow duration-300 flex flex-col h-full">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="text-xs font-bold text-gray-400 mb-1 block">${r.id}</span>
                            <h3 class="font-bold text-lg text-brand-gray leading-tight">${r.name}</h3>
                        </div>
                        <button class="w-8 h-8 rounded-full hover:bg-white flex items-center justify-center text-gray-400 hover:text-brand-blue transition-colors">
                            <i class="fa-solid fa-ellipsis-vertical"></i>
                        </button>
                    </div>
                    
                    <div class="mb-5 space-y-2">
                        <div class="flex items-center text-sm text-brand-gray">
                            <i class="fa-regular fa-calendar w-5 text-brand-blue"></i>
                            <span class="font-medium">${formatDate(r.date)}</span>
                        </div>
                        <div class="flex items-center text-sm text-brand-gray-light">
                            <i class="fa-solid fa-map-location-dot w-5 text-brand-wood"></i>
                            <span>${r.areas.join(' • ')}</span>
                        </div>
                    </div>
                    
                    <div class="mt-auto pt-4 border-t border-gray-200/60">
                        <div class="flex justify-between items-end mb-2">
                            <span class="text-xs font-semibold text-gray-500 uppercase">Total: ${formatMoney(r.total)}</span>
                            <span class="text-xs font-bold ${r.balance === 0 ? 'text-brand-green' : 'text-orange-600'}">
                                ${r.balance === 0 ? 'Liquidado' : 'Saldo: ' + formatMoney(r.balance)}
                            </span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-1.5">
                            <div class="h-1.5 rounded-full ${r.balance === 0 ? 'bg-brand-green' : 'bg-brand-blue'}" style="width: ${(r.paid/r.total)*100}%"></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-days');
            let html = '';
            // Offset for visual mock
            for(let i = 0; i < 4; i++) {
                html += `<div class="cal-day bg-transparent border-transparent cursor-default"></div>`;
            }
            for(let i = 1; i <= 31; i++) {
                // Mock some events
                const hasEvent = [15, 18, 20, 24].includes(i);
                const isToday = i === 15;
                let classes = isToday ? 'active-day shadow-md' : '';
                classes += hasEvent ? ' has-event' : '';
                
                html += `
                    <div class="cal-day ${classes}">
                        <span class="text-sm font-medium">${i}</span>
                    </div>
                `;
            }
            grid.innerHTML = html;
        }

        // Modal Functions
        function openModal() {
            const modal = document.getElementById('modal-form');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            // small delay to allow display:flex to apply before transition
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('modal-form');
            const content = document.getElementById('modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function saveMock() {
            closeModal();
            showToast("Reservación creada con éxito");
        }

        // Utilities
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function updateDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            let str = new Date().toLocaleDateString('es-MX', options);
            document.getElementById('current-date').textContent = str.charAt(0).toUpperCase() + str.slice(1);
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            updateDate();
            renderDashboard();
            renderReservations();
            renderCalendar();
            // Start at dashboard
            navigate('dashboard');
        });

    </script>
</body>
</html>
