<div class="cal-day-header">Vie</div>
            <div class="cal-day-header">Sáb</div>
            <!-- Los días del mes se renderizan dinámicamente -->
            <div id="cal-days-container" style="display: contents;"></div>
        </div>
    </div>

    <!-- Botón Flotante -->
    <button class="btn-float" onclick="abrirModalNuevo()"><i class="fas fa-plus"></i></button>

    <!-- Modal Form (Crear / Editar) -->
    <div class="modal" id="modal-form">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title" style="font-size: 16px;">Nueva Reservación</h3>
                <button class="btn-icon-head" onclick="cerrarModal()"><i class="fas fa-times"></i></button>
            </div>
            
            <form id="renta-form" onsubmit="guardarRegistro(event)">
                <input type="hidden" id="field-folio">

                <div class="form-grid">
                    <div class="form-group span-2">
                        <label>Nombre del Cliente</label>
                        <input type="text" id="field-nombre" required placeholder="Nombre completo">
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label>Mes Renta</label>
                            <select id="field-mes">
                                <option value="enero">Enero</option>
                                <option value="febrero">Febrero</option>
                                <option value="marzo">Marzo</option>
                                <option value="abril">Abril</option>
                                <option value="mayo">Mayo</option>
                                <option value="junio">Junio</option>
                                <option value="julio">Julio</option>
                                <option value="agosto">Agosto</option>
                                <option value="septiembre">Septiembre</option>
                                <option value="octubre">Octubre</option>
                                <option value="noviembre">Noviembre</option>
                                <option value="diciembre">Diciembre</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="tel" id="field-telefono" placeholder="662...">
                        </div>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label>Hospedaje</label>
                            <input type="text" id="field-hospedaje" placeholder="Ej. 12 pers.">
                        </div>
                        <div class="form-group">
                            <label>Evento</label>
                            <input type="text" id="field-evento" placeholder="Ej. 50 pers.">
                        </div>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label>Fecha Entrada</label>
                            <input type="date" id="field-fecha-entrada">
                        </div>
                        <div class="form-group">
                            <label>Fecha Salida</label>
                            <input type="date" id="field-fecha-salida">
                        </div>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label>Total Venta ($)</label>
                            <input type="number" step="0.01" id="field-total" oninput="calcularSaldoForm()" required placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Saldo Pendiente ($)</label>
                            <input type="number" step="0.01" id="field-saldo" readonly style="background: #f1f5f9; font-weight: 700; color: var(--danger);">
                        </div>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label>Anticipo 1 ($)</label>
                            <input type="number" step="0.01" id="field-anticipo1" oninput="calcularSaldoForm()" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Fecha Anticipo 1</label>
                            <input type="date" id="field-f-anticipo1">
                        </div>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label>Anticipo 2 ($)</label>
                            <input type="number" step="0.01" id="field-anticipo2" oninput="calcularSaldoForm()" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Fecha Anticipo 2</label>
                            <input type="date" id="field-f-anticipo2">
                        </div>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label>Comisión ($)</label>
                            <input type="number" step="0.01" id="field-comision" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Fecha Cobrado</label>
                            <input type="date" id="field-f-cobrado">
                        </div>
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label>Comisión No.</label>
                            <input type="text" id="field-comision-no">
                        </div>
                        <div class="form-group">
                            <label>Teléfono 2</label>
                            <input type="tel" id="field-telefono2">
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btn-guardar">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUuSbd7XOIskwITU6wPbw7jDajpHvTHcOYaVSwWW83y9tOHzECOmk8yzMASq8eNJNT/exec";
        let registrosGlobales = [];
        let fechaCalActual = new Date();

        function parseMonto(val) {
            if (!val) return 0;
            if (typeof val === 'number') return isNaN(val) ? 0 : val;
            let num = parseFloat(String(val).replace(/[^0-9.-]+/g, ""));
            return isNaN(num) ? 0 : num;
        }

        function fmtMoneda(val) {
            return `$${parseMonto(val).toLocaleString('es-MX', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
        }

        function parseFechaLocal(str) {
            if (!str) return null;
            let d;
            if (str.includes('/')) {
                const p = str.split('/');
                d = new Date(p[2], p[1] - 1, p[0]);
            } else {
                const p = str.split('-');
                d = new Date(p[0], p[1] - 1, p[2]);
            }
            d.setHours(0,0,0,0);
            return d;
        }

        async function cargarDatos() {
            try {
                const res = await fetch(SCRIPT_URL, { method: 'GET', redirect: 'follow' });
                registrosGlobales = await res.json();
                aplicarFiltros();
                renderizarCalendario();
                actualizarKPIs(registrosGlobales);
            } catch (err) {
                console.error(err);
            }
        }

        function cambiarVista(vista) {
            document.getElementById('tab-lista').classList.toggle('active', vista === 'lista');
            document.getElementById('tab-cal').classList.toggle('active', vista === 'calendario');
            document.getElementById('vista-lista').style.display = vista === 'lista' ? 'block' : 'none';
            document.getElementById('vista-calendario').style.display = vista === 'calendario' ? 'block' : 'none';
        }

        // ==========================================
        // LÓGICA DEL CALENDARIO POR BLOQUES DE HORARIO
        // ==========================================
        function cambiarMesCal(dir) {
            fechaCalActual.setMonth(fechaCalActual.getMonth() + dir);
            renderizarCalendario();
        }

        function renderizarCalendario() {
            const container = document.getElementById('cal-days-container');
            container.innerHTML = '';

            const ano = fechaCalActual.getFullYear();
            const mes = fechaCalActual.getMonth();

            const primerDia = new Date(ano, mes, 1).getDay();
            const ultimoDia = new Date(ano, mes + 1, 0).getDate();

            const nombresMeses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            document.getElementById('cal-month-title').textContent = `${nombresMeses[mes]} ${ano}`;

            // Espacios vacíos antes del día 1
            for (let i = 0; i < primerDia; i++) {
                const empty = document.createElement('div');
                empty.className = 'cal-day-cell';
                empty.style.background = 'transparent';
                empty.style.borderColor = 'transparent';
                container.appendChild(empty);
            }

            // Días del mes
            for (let dia = 1; dia <= ultimoDia; dia++) {
                const celdaFecha = new Date(ano, mes, dia);
                celdaFecha.setHours(0,0,0,0);

                const cell = document.createElement('div');
                cell.className = 'cal-day-cell';

                let html = `<div class="cal-day-num">${dia}</div><div class="cal-blocks">`;

                registrosGlobales.forEach(r => {
                    const fEntrada = parseFechaLocal(r.fecha_entrada);
                    const fSalida = parseFechaLocal(r.fecha_salida);

                    if (!fEntrada) return;

                    const fSalidaEfectiva = fSalida || new Date(fEntrada);

                    // Misma fecha de entrada y salida (Solo Tarde/Noche)
                    if (celdaFecha.getTime() === fEntrada.getTime() && fEntrada.getTime() === fSalidaEfectiva.getTime()) {
                        html += `<div class="block-tag block-tarde" title="${r.nombre}">🌙 ${r.nombre.split(' ')[0]}</div>`;
                    }
                    // Día de entrada de hospedaje (Ocupa Tarde)
                    else if (celdaFecha.getTime() === fEntrada.getTime()) {
                        html += `<div class="block-tag block-tarde" title="${r.nombre}">🌙 In: ${r.nombre.split(' ')[0]}</div>`;
                    }
                    // Día de salida de hospedaje (Ocupa Mañana)
                    else if (celdaFecha.getTime() === fSalidaEfectiva.getTime()) {
                        html += `<div class="block-tag block-manana" title="${r.nombre}">☀️ Out: ${r.nombre.split(' ')[0]}</div>`;
                    }
                    // Días intermedios completos
                    else if (celdaFecha > fEntrada && celdaFecha < fSalidaEfectiva) {
                        html += `<div class="block-tag block-full" title="${r.nombre}">🔴 ${r.nombre.split(' ')[0]}</div>`;
                    }
                });

                html += `</div>`;
                cell.innerHTML = html;
                container.appendChild(cell);
            }
        }

        function aplicarFiltros() {
            const query = document.getElementById('input-search').value.toLowerCase();
            let resultado = registrosGlobales.filter(r => 
                String(r.folio).includes(query) || 
                (r.nombre && r.nombre.toLowerCase().includes(query))
            );
            renderizarTarjetas(resultado);
        }

        function renderizarTarjetas(registros) {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            if (registros.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted);">No se encontraron reservaciones.</div>`;
                return;
            }

            registros.forEach(row => {
                const total = parseMonto(row.total_venta);
                const ant1 = parseMonto(row.anticipo1);
                const ant2 = parseMonto(row.anticipo2);
                const saldo = parseMonto(row.saldo);

                const card = document.createElement('div');
                card.className = 'renta-card';
                card.innerHTML = `
                    <div class="card-header-row">
                        <span class="card-folio">Folio #${row.folio}</span>
                        <span style="font-size: 11px; text-transform: uppercase; font-weight:700; color: var(--text-muted);">${row.mes_renta || ''}</span>
                    </div>

                    <div class="card-cliente">${row.nombre || 'Sin nombre'}</div>
                    <div class="card-subtext">
                        <span><i class="fas fa-phone"></i> ${row.telefono || 'N/A'}</span>
                        ${row.hospedaje ? `<span><i class="fas fa-bed"></i> ${row.hospedaje}</span>` : ''}
                    </div>

                    <div class="card-grid-info">
                        <div class="info-item">
                            <span>Total Venta</span>
                            <strong style="color: var(--primary-accent);">${fmtMoneda(total)}</strong>
                        </div>
                        <div class="info-item">
                            <span>Anticipos</span>
                            <strong style="color: var(--success);">${fmtMoneda(ant1 + ant2)}</strong>
                        </div>
                        <div class="info-item">
                            <span>Saldo</span>
                            <strong style="color: ${saldo > 0 ? 'var(--danger)' : 'var(--success)'};">${fmtMoneda(saldo)}</strong>
                        </div>
                        <div class="info-item">
                            <span>F. Entrada</span>
                            <strong>${row.fecha_entrada || '—'}</strong>
                        </div>
                    </div>

                    <div class="card-actions">
                        <button class="btn-card-action btn-card-edit" onclick="abrirModalEditar(${row.folio})"><i class="fas fa-pen"></i> Editar</button>
                        <button class="btn-card-action btn-card-delete" onclick="eliminarRegistro(${row.folio})"><i class="fas fa-trash"></i> Eliminar</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function actualizarKPIs(registros) {
            let totalVentas = 0, totalCobrado = 0, totalSaldo = 0;
            registros.forEach(r => {
                totalVentas += parseMonto(r.total_venta);
                totalCobrado += (parseMonto(r.anticipo1) + parseMonto(r.anticipo2));
                totalSaldo += parseMonto(r.saldo);
            });

            document.getElementById('kpi-total').textContent = fmtMoneda(totalVentas);
            document.getElementById('kpi-cobrado').textContent = fmtMoneda(totalCobrado);
            document.getElementById('kpi-saldo').textContent = fmtMoneda(totalSaldo);
        }

        function calcularSaldoForm() {
            const total = parseMonto(document.getElementById('field-total').value);
            const a1 = parseMonto(document.getElementById('field-anticipo1').value);
            const a2 = parseMonto(document.getElementById('field-anticipo2').value);
            const saldo = total - (a1 + a2);
            document.getElementById('field-saldo').value = saldo > 0 ? saldo.toFixed(2) : 0;
        }

        function abrirModalNuevo() {
            document.getElementById('modal-title').textContent = "Nueva Reservación";
            document.getElementById('renta-form').reset();
            document.getElementById('field-folio').value = "";
            document.getElementById('modal-form').classList.add('active');
        }

        function abrirModalEditar(folio) {
            const row = registrosGlobales.find(r => String(r.folio) === String(folio));
            if (!row) return;

            document.getElementById('modal-title').textContent = `Editar Folio #${folio}`;
            document.getElementById('field-folio').value = row.folio;
            document.getElementById('field-nombre').value = row.nombre || '';
            document.getElementById('field-mes').value = (row.mes_renta || 'octubre').toLowerCase();
            document.getElementById('field-telefono').value = row.telefono || '';
            document.getElementById('field-hospedaje').value = row.hospedaje || '';
            document.getElementById('field-evento').value = row.evento || '';
            document.getElementById('field-fecha-entrada').value = row.fecha_entrada || '';
            document.getElementById('field-fecha-salida').value = row.fecha_salida || '';
            document.getElementById('field-total').value = row.total_venta || '';
            document.getElementById('field-anticipo1').value = row.anticipo1 || '';
            document.getElementById('field-f-anticipo1').value = row.fecha_anticipo1 || '';
            document.getElementById('field-anticipo2').value = row.anticipo2 || '';
            document.getElementById('field-f-anticipo2').value = row.fecha_anticipo2 || '';
            document.getElementById('field-saldo').value = row.saldo || '';
            document.getElementById('field-comision').value = row.comision || '';
            document.getElementById('field-f-cobrado').value = row.fecha_cobrado || '';
            document.getElementById('field-comision-no').value = row.comision_no || '';
            document.getElementById('field-telefono2').value = row.telefono_2 || '';

            document.getElementById('modal-form').classList.add('active');
        }

        function cerrarModal() {
            document.getElementById('modal-form').classList.remove('active');
        }

        async function guardarRegistro(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-guardar');
            btn.disabled = true;
            btn.textContent = "Guardando...";

            const folio = document.getElementById('field-folio').value;
            const payload = {
                folio: folio,
                nombre: document.getElementById('field-nombre').value,
                mes_renta: document.getElementById('field-mes').value,
                telefono: document.getElementById('field-telefono').value,
                hospedaje: document.getElementById('field-hospedaje').value,
                evento: document.getElementById('field-evento').value,
                fecha_entrada: document.getElementById('field-fecha-entrada').value,
                fecha_salida: document.getElementById('field-fecha-salida').value,
                total_venta: document.getElementById('field-total').value,
                anticipo1: document.getElementById('field-anticipo1').value,
                fecha_anticipo1: document.getElementById('field-f-anticipo1').value,
                anticipo2: document.getElementById('field-anticipo2').value,
                fecha_anticipo2: document.getElementById('field-f-anticipo2').value,
                saldo: document.getElementById('field-saldo').value,
                comision: document.getElementById('field-comision').value,
                fecha_cobrado: document.getElementById('field-f-cobrado').value,
                comision_no: document.getElementById('field-comision-no').value,
                telefono_2: document.getElementById('field-telefono2').value
            };

            const accion = folio ? "actualizar" : "crear";

            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ accion: accion, payload: payload }) });
                cerrarModal();
                cargarDatos();
            } catch (err) {
                alert("Error al guardar: " + err);
            } finally {
                btn.disabled = false;
                btn.textContent = "Guardar";
            }
        }

        async function eliminarRegistro(folio) {
            if (!confirm(`¿Eliminar reservación #${folio}?`)) return;

            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ accion: "eliminar", folio: folio }) });
                cargarDatos();
            } catch (err) {
                alert("Error al eliminar: " + err);
            }
        }

        document.addEventListener('DOMContentLoaded', cargarDatos);
    </script>
</body>
</html>
