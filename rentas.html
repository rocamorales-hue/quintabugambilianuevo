<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Rentas - Quinta Bugambilia</title>
    <!-- Estilos de FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --border-color: #e2e8f0;
            --bg-hover: #f8fafc;
            --text-color: #334155;
            --accent-color: #eab308;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
        }

        .table-container {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow-x: auto;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            white-space: nowrap;
        }

        th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 700;
            text-transform: uppercase;
            padding: 14px 12px;
            text-align: left;
            border-bottom: 2px solid var(--border-color);
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tr:hover {
            background-color: var(--bg-hover);
        }

        .checkbox-cell {
            text-align: center;
            width: 30px;
        }

        .folio-cell {
            font-weight: 700;
            color: #2563eb;
        }

        .mes-cell {
            text-transform: lowercase;
            font-weight: 600;
        }

        .monto {
            font-weight: 600;
        }

        .monto-total {
            color: #059669; /* Verde para totales */
            font-weight: 700;
        }

        .monto-anticipo {
            color: #059669;
        }

        .monto-saldo {
            color: #dc2626; /* Rojo para saldos pendientes */
            font-weight: 700;
        }

        .editable-field {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            padding: 2px 5px;
            font-size: 13px;
            transition: color 0.2s;
        }

        .btn-icon:hover {
            color: var(--primary-color);
        }

        .btn-edit {
            color: #eab308;
        }

        .btn-edit:hover {
            color: #ca8a04;
        }

        .btn-delete {
            color: #cbd5e1;
        }

        .btn-delete:hover {
            color: #ef4444;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="table-container">
        <table id="tabla-rentas">
            <thead>
                <tr>
                    <th class="checkbox-cell"><input type="checkbox" id="select-all"></th>
                    <th>FOLIO</th>
                    <th>MES DE RENTA</th>
                    <th>NOMBRE</th>
                    <th>TELÉFONO</th>
                    <th>HOSPEDAJE</th>
                    <th>EVENTO</th>
                    <th>FECHA ENTRADA</th>
                    <th>FECHA SALIDA</th>
                    <th>TOTAL VENTA</th>
                    <th>ANTICIPO 1</th>
                    <th>FECHA ANTICPO</th>
                    <th>ANTICIPO 2</th>
                    <th>FECHA ANTICPO</th>
                    <th>SALDO</th>
                    <th>COMISIÓN</th>
                    <th>FECHA COBRADO</th>
                    <th>COMISION NO.</th>
                    <th>TELÉFONO 2</th>
                    <th>ACCIÓN</th>
                </tr>
            </thead>
            <tbody id="tabla-body">
                <tr>
                    <td colspan="20" class="loading">
                        <i class="fas fa-spinner fa-spin"></i> Cargando datos de reservaciones...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // URL de tu WebApp desplegada en Google Apps Script
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUuSbd7XOIskwITU6wPbw7jDajpHvTHcOYaVSwWW83y9tOHzECOmk8yzMASq8eNJNT/exec";

        // Función para parsear montos en dinero y evitar $NaN
        function parseMonto(valor) {
            if (valor === null || valor === undefined || valor === '') return 0;
            if (typeof valor === 'number') return isNaN(valor) ? 0 : valor;
            
            const limpio = String(valor).replace(/[^0-9.-]+/g, "");
            const numero = parseFloat(limpio);
            
            return isNaN(numero) ? 0 : numero;
        }

        // Función para formatear a moneda ($X,XXX.XX)
        function formatearMoneda(valor) {
            const num = parseMonto(valor);
            return `$${num.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        // Cargar registros desde Apps Script corrigiendo el problema de CORS y redirección
        async function cargarDatos() {
            const tbody = document.getElementById('tabla-body');
            
            try {
                // Si la página corre internamente dentro del proyecto de Apps Script
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run.withSuccessHandler(renderizarTabla).obtenerDatosRentas();
                } else {
                    // Petición Fetch externa con redirección habilitada (CRÍTICO para evitar CORS en Google Apps Script)
                    const respuesta = await fetch(SCRIPT_URL, {
                        method: 'GET',
                        redirect: 'follow'
                    });

                    if (!respuesta.ok) {
                        throw new Error(`Error HTTP: ${respuesta.status}`);
                    }
                    
                    const datos = await respuesta.json();
                    renderizarTabla(datos);
                }
            } catch (error) {
                console.error("Error al cargar datos:", error);
                tbody.innerHTML = `<tr><td colspan="20" style="text-align:center; color: #ef4444; padding: 20px;">
                    Error al consultar los datos. Asegúrate de haber publicado una <strong>Nueva Versión</strong> de la WebApp en Apps Script.
                </td></tr>`;
            }
        }

        // Renderizar filas en la tabla
        function renderizarTabla(registros) {
            const tbody = document.getElementById('tabla-body');
            tbody.innerHTML = '';

            if (!registros || registros.length === 0) {
                tbody.innerHTML = `<tr><td colspan="20" style="text-align:center; padding: 20px;">No se encontraron registros.</td></tr>`;
                return;
            }

            registros.forEach(row => {
                // Parseo seguro de montos
                const anticipo1 = parseMonto(row.anticipo1 || row.anticipo_1);
                const anticipo2 = parseMonto(row.anticipo2 || row.anticipo_2);
                const saldo = parseMonto(row.saldo);
                const comision = parseMonto(row.comision);

                // Cálculo seguro del TOTAL VENTA para evitar $NaN
                let totalVenta = parseMonto(row.total_venta);
                if (totalVenta === 0 && (anticipo1 > 0 || anticipo2 > 0)) {
                    totalVenta = anticipo1 + anticipo2 + saldo;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="checkbox-cell"><input type="checkbox" value="${row.folio}"></td>
                    <td class="folio-cell">#${row.folio || ''}</td>
                    <td class="mes-cell">${row.mes_renta || ''}</td>
                    <td>${row.nombre || ''}</td>
                    <td>${row.telefono || ''}</td>
                    <td>${row.hospedaje || '—'}</td>
                    <td>${row.evento || '—'}</td>
                    <td>${row.fecha_entrada || ''}</td>
                    <td>${row.fecha_salida || ''}</td>
                    
                    <!-- Total corregido sin $NaN -->
                    <td class="monto monto-total">${formatearMoneda(totalVenta)}</td>
                    
                    <td class="monto monto-anticipo">${formatearMoneda(anticipo1)}</td>
                    <td>${row.fecha_anticipo || row.fecha_anticpo_1 || ''}</td>
                    
                    <td class="monto monto-anticipo">
                        <div class="editable-field">
                            <span>${formatearMoneda(anticipo2)}</span>
                            <button class="btn-icon" title="Notas / Editar"><i class="far fa-sticky-note"></i></button>
                        </div>
                    </td>
                    <td>${row.fecha_anticpo_2 || ''}</td>
                    
                    <td class="monto monto-saldo">${formatearMoneda(saldo)}</td>
                    <td class="monto">${formatearMoneda(comision)}</td>
                    <td>${row.fecha_cobrado || ''}</td>
                    <td>${row.comision_no || ''}</td>
                    <td>${row.telefono_2 || ''}</td>
                    
                    <td>
                        <button class="btn-icon btn-edit" title="Editar Registro"><i class="fas fa-pencil-alt"></i></button>
                        <button class="btn-icon btn-delete" title="Eliminar Registro"><i class="fas fa-trash-alt"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Cargar datos al abrir la página
        document.addEventListener('DOMContentLoaded', cargarDatos);
    </script>
</body>
</html>
