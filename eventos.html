<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quinta Bugambilia – Contrato de Evento</title>
<meta name="description" content="Quinta Bugambilia · Real del 14, Hermosillo — panel interno de cotizaciones y contratos.">
<meta name="theme-color" content="#2d5a46">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js?v=5').then(reg => reg.update()).catch(() => {}); });
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--bg:#efe8da;--card:#fbfbf8;--mar:linear-gradient(135deg,#fff 0%,#f3f3ef 55%,#fcfcfa 100%);--ink:#2d5a46;--text:#3a4043;--muted:#7b8080;--line:#e2dac9;--wood:#9a6b45;--wood2:#f1e3d3;--blue:#2f6690;--blue2:#dde9f3;--ok2:#dcebe2;--bad:#a8432f;--bad2:#f6dfd8;--sh:0 2px 10px rgba(58,64,67,.08)}
:root[data-theme=dark]{--bg:#121815;--card:#1b2420;--mar:linear-gradient(135deg,#202b26,#1b2420);--ink:#7fc4a0;--text:#dde5e0;--muted:#92a09a;--line:#2c3833;--wood:#d3a073;--wood2:#3a2d21;--blue:#7fb2dc;--blue2:#1d2c3a;--ok2:#1c3228;--bad:#f0907c;--bad2:#3a211b;--sh:none}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);max-width:640px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 100px);font-size:15px}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.brand{font-family:Fraunces,serif;font-size:21px;font-weight:700;color:var(--ink);line-height:1.1}.brand small{display:block;font-family:'DM Sans';font-size:12px;font-weight:500;color:var(--muted)}
.ibtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-left:6px}
.hero{border-radius:24px;padding:18px;color:#fff;background:radial-gradient(circle at 85% 10%,rgba(255,255,255,.16),transparent 40%),linear-gradient(150deg,#2d5a46,#1f4333);border-bottom:5px solid var(--wood);margin-bottom:14px}
h1{font-family:Fraunces,serif;font-size:24px;line-height:1.15}.subtitle{font-size:13px;opacity:.85;margin-top:4px}
.form-container{background:var(--mar);border:1px solid var(--line);border-radius:22px;padding:4px 16px 18px;box-shadow:var(--sh)}
.sec{font-family:Fraunces,serif;font-size:18px;font-weight:700;color:var(--ink);margin:22px 0 10px;padding-left:10px;border-left:4px solid var(--wood)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:340px){.row{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
label{font-size:12px;color:var(--muted)}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);min-width:0}
textarea{min-height:90px;resize:vertical}
input[readonly]{background:var(--bg);font-weight:700}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink);flex:none;padding:0}
small{color:var(--muted);font-size:12px}
.btn-print,.btn-generar{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;font-weight:700;font-size:15px;padding:0 16px;width:100%;margin:8px 0}
.btn-print{background:var(--blue2);color:var(--blue)}.btn-generar{background:var(--ink);color:var(--card)}
.x{border-radius:12px;background:var(--bad2);color:var(--bad);font-weight:700}
.extra-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin:6px 0}
.extra-item .xl{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;min-height:40px;font-size:14px;color:var(--text)}
.extra-item .xp{width:6.5rem;flex:none;text-align:right}
.noche,.cpt,.dsc{display:flex;gap:8px;align-items:center;margin:6px 0}
.noche span{flex:1;font-size:14px}.noche input,.cpt .ca{width:7.5rem;flex:none}.cpt .cn{flex:1;min-width:0}.cpt .x{min-height:44px;width:44px;flex:none}.dsc select{width:5rem;flex:none}
#eventos{counter-reset:ev}
.evt{border:1px solid var(--line);border-left:5px solid var(--wood);border-radius:16px;padding:12px;margin:10px 0;background:var(--card)}
.evh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.evh h4{font-family:Fraunces,serif;font-size:16px;color:var(--ink)}
.evh h4::before{counter-increment:ev;content:"Evento " counter(ev)}.evh .x{min-height:44px;width:44px}
.evg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.evg label{display:flex;flex-direction:column;gap:4px}.evg label:first-child{grid-column:1/-1}
#resumen{background:var(--wood2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0;font-size:14px}
#resumen div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}#resumen .t{border-top:1px solid var(--wood);margin-top:6px;padding-top:8px;font-size:17px;color:var(--ink)}
#aviso{display:none;background:var(--bad2);color:var(--bad);border-radius:12px;padding:12px 14px;margin-top:12px;font-weight:500}#aviso.on{display:block}
#contrato-wrap[hidden]{display:none}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin:14px auto}.acciones button{flex:1 1 180px;margin:0}.acciones button:disabled{opacity:.5}
#pdfEstado{width:100%;text-align:center;font-size:13px;color:var(--muted)}
.sbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:640px;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);z-index:50}
.sbar span{font-size:11px;color:var(--muted);display:block}.sbar b{font-family:Fraunces,serif;font-size:21px;color:var(--ink)}.sbar .btn-generar{margin:0;flex:1;background:var(--wood);color:#fff}
.ghead{font-size:12px;font-weight:700;color:var(--wood);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 4px}
.nota{background:var(--blue2);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px;line-height:1.6}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
    /* Documento (pantalla, PDF e impresión) */
    .doc{font:13px/1.5 "Times New Roman",Georgia,serif;color:#111;background:#fff;padding:1.2rem;max-width:820px;margin:1rem auto;border:1px solid #ddd;border-radius:6px}
    .doc h2{font-size:1.05em;text-align:center;margin:0 0 1em}
    .doc .cl{margin:0 0 .65em;text-align:justify}
    .doc ul{margin:.3em 0 .3em 1.4em;padding:0}
    .doc .tb{width:100%;border-collapse:collapse;margin:.4em 0;font-size:.95em}
    .doc .tb td{border:1px solid #bbb;padding:3px 7px}
    .doc .tb.r td:last-child{text-align:right;white-space:nowrap}
    .doc .tot td{font-weight:bold;background:#f2f2f2}
    .doc .extras{white-space:pre-line;font-style:italic;border:1px solid #ccc;padding:.5em .7em;margin:.7em 0}
    .doc .firmas{display:flex;gap:2rem;margin-top:3.5rem;text-align:center}
    .doc .firmas>div{flex:1;border-top:1px solid #000;padding-top:4px;font-size:.85em}
    @media print{
      body *{visibility:hidden}
      #docContrato,#docContrato *{visibility:visible}
      #docContrato{position:absolute;left:0;top:0;width:100%;margin:0;border:0;border-radius:0;padding:0}
      @page{size:letter;margin:14mm}
    }
</style>
</head>
<body>
<header class="top"><div class="brand">Quinta Bugambilia<small>Eventos</small></div><div><button class="ibtn" onclick="clearForm()" aria-label="Nuevo contrato"><i class="fas fa-file-circle-plus"></i></button><button class="ibtn" onclick="tema()" aria-label="Tema"><i class="fas fa-circle-half-stroke"></i></button></div></header>
<main id="main-content">
    <div class="hero"><h1>Contrato de Evento</h1><p class="subtitle">Cotiza el evento, arma el contrato y compártelo en PDF</p></div>

    <div class="form-container">
      <div class="sec">Cliente</div>
      <div class="row">
        <div class="field"><label for="nombreInput">Nombre del Cliente Arrendatario</label>
          <input type="text" id="nombreInput" placeholder="Ej. Juan Pérez" autocomplete="off"></div>
        <div class="field"><label for="ineInput">Identificación Oficial (INE / Pasaporte)</label>
          <input type="text" id="ineInput" placeholder="Clave de Elector o No. de Documento" autocomplete="off"></div>
      </div>
      <div class="row">
        <div class="field"><label for="domicilioInput">Domicilio del Cliente</label>
          <input type="text" id="domicilioInput" placeholder="Calle, número, colonia, ciudad" autocomplete="off"></div>
        <div class="field"><label for="telefonoInput">Teléfono</label>
          <input type="tel" id="telefonoInput" placeholder="662 000 0000" inputmode="tel" autocomplete="off"></div>
      </div>

      <div class="sec">Evento</div>
      <div class="field"><label for="tipoEvento">Tipo de evento</label><input type="text" id="tipoEvento" placeholder="Ej. XV años, boda, cumpleaños" autocomplete="off"></div>
      <div id="eventos"></div>
      <button type="button" class="btn-print" onclick="agregarEvento()">+ Agregar otro día de evento</button>

      <div class="sec">Extras y conceptos</div>
      <label>Equipos y accesos adicionales (puedes editar el precio de cada uno)</label>
      <div class="extras-container" id="extras"></div>
      <div class="nota">💡 Precios por evento.<br>🔹 Recomendamos confirmar disponibilidad al reservar.</div>
      <label>Conceptos adicionales</label>
      <div id="conceptos"></div>
      <button type="button" class="btn-print" onclick="agregarConcepto()">+ Agregar concepto</button>

      <div class="sec">Descuento y precio final</div>
      <div class="row">
        <div class="field"><label for="descuentoInput">Descuento</label>
          <div class="dsc"><select id="descTipo"><option value="$">$</option><option value="%">%</option></select>
          <input type="number" id="descuentoInput" min="0" value="0" inputmode="decimal"></div></div>
        <div class="field"><label for="descMotivo">Motivo del descuento</label><input type="text" id="descMotivo" placeholder="Ej. Cliente frecuente"></div>
      </div>
      <div class="field"><label for="totalFijo">Precio final pactado ($): opcional, sustituye al total calculado</label>
        <input type="number" id="totalFijo" min="0" inputmode="decimal" placeholder="Vacío = usar el total calculado"></div>

      <div class="row">
        <div class="field"><label for="precioInput">Precio Total Calculado ($)</label><input type="text" id="precioInput" readonly></div>
        <div class="field"><label for="depositoInput">Depósito en Garantía (Reembolsable)</label><input type="text" id="depositoInput" value="$1,000.00" inputmode="decimal"></div>
      </div>
      <div id="resumen"></div>

      <div class="field">
        <label for="anotacionesInput">Anotaciones Especiales</label>
        <textarea id="anotacionesInput" placeholder="Ej. Se autoriza la entrada de proveedores externos..."></textarea>
      </div>

      <div id="aviso" role="alert"></div>
      <button type="button" class="btn-print" onclick="cotizar()"><i class="fab fa-whatsapp"></i> Enviar cotización por WhatsApp</button>
    </div>

    <div id="contrato-wrap" hidden>
      <div id="docContrato" class="doc"></div>
      <div class="acciones">
        <button class="btn-generar" id="btnShare" onclick="compartir()" disabled>Guardar / Compartir PDF</button>
        <button class="btn-print" id="btnDl" onclick="descargar()" disabled>Descargar PDF</button>
        <button class="btn-print" onclick="window.print()">Imprimir</button>
        <div id="pdfEstado"></div>
      </div>
    </div>
  </main>
<div class="sbar"><div><span>Total</span><b id="sbTotal">$0.00</b></div><button class="btn-generar" onclick="generar()"><i class="fas fa-file-contract"></i> Generar contrato</button></div>
<script>
    /* ===== CONFIGURACIÓN (edita aquí tarifas, datos del arrendador y banco) ===== */
    const CFG = {
      arrendador: 'Javier Antonio Morales Mizquez',
      domicilio: 'Fraccionamiento Real del Catorce, Hermosillo, Sonora', // agrega calle y número
      dormitorios: 12,
      anticipo: 0.30,
      banco: [['Banco','Santander'],['Titular','Javier Antonio Morales Mizquez'],['Número de Tarjeta','5579 0890 0728 7264'],['CLABE','014760655114097664'],['Número de Cuenta','65511409766']]
    };
    const PCT = Math.round(CFG.anticipo * 100);
    const EXTRAS = [
      ['Brincolin Estándar',500,'Equipos'],['Brincolin Acuático Grande',1200,'Equipos'],['Mesa de Futbolito',400,'Equipos'],['Bocina de Alta Potencia',400,'Equipos'],['Calentador Ambiental de Gas',600,'Equipos'],
      ['Calentón ambiental',480,'Equipos'],['Aerocooler portátil',480,'Equipos'],['Mesa para snacks',350,'Equipos'],['Torre de luces y humo',650,'Equipos'],
      ['Casa Principal (acceso completo)',1500,'Accesos adicionales'],['Casa Principal (sin acceso a cuartos)',1000,'Accesos adicionales'],['Departamento Independiente',1000,'Accesos adicionales'],['Salón de entretenimiento',1000,'Accesos adicionales']
    ];

    const $ = id => document.getElementById(id);
    const num = v => parseFloat(String(v).replace(/[^0-9.]/g, '')) || 0;
    const mxn = v => v.toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const fecha = s => s ? new Date(s + 'T12:00:00').toLocaleDateString('es-MX', { day:'numeric', month:'long', year:'numeric' }) : '__________';
    const hr = id => ($(id).value || '--:--') + ' hrs';
    let pdfBlob = null, pdfName = '', seq = 0, NP = [];

    function letras(n) {
      const U = ['','UN','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE','VEINTIÚN','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO','VEINTISÉIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE'];
      const D = ['','','','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
      const C = ['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
      const b = n => {
        if (n === 100) return 'CIEN';
        let s = C[Math.floor(n / 100)], r = n % 100;
        if (r < 30) s += (s && r ? ' ' : '') + U[r];
        else s += (s ? ' ' : '') + D[Math.floor(r / 10)] + (r % 10 ? ' Y ' + U[r % 10] : '');
        return s.trim();
      };
      if (n === 0) return 'CERO';
      const m = Math.floor(n / 1e6), k = Math.floor(n % 1e6 / 1000), r = n % 1000;
      let s = '';
      if (m) s += (m === 1 ? 'UN MILLÓN' : b(m) + ' MILLONES') + ' ';
      if (k) s += (k === 1 ? '' : b(k) + ' ') + 'MIL ';
      if (r) s += b(r);
      return s.trim();
    }
    function letrasMXN(t) {
      t = Math.round(t * 100) / 100;
      const e = Math.floor(t), c = Math.round((t - e) * 100);
      return `${letras(e)}${e >= 1e6 && e % 1e6 === 0 ? ' DE' : ''} ${e === 1 ? 'PESO' : 'PESOS'} ${String(c).padStart(2, '0')}/100 M.N.`;
    }

    const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const eventos = () => [...document.querySelectorAll('.evt')].map(r => ({ f: r.querySelector('.ef').value, i: r.querySelector('.ei').value, h: r.querySelector('.eh').value, p: parseInt(r.querySelector('.ep').value) || 0, c: num(r.querySelector('.ec').value) })).sort((x, y) => (x.f + x.i).localeCompare(y.f + y.i));
    function agregarEvento(init) {
      const last = [...document.querySelectorAll('.evt .ef')].map(i => i.value).filter(Boolean).sort().pop();
      let f = '';
      if (last) { const d = new Date(last + 'T12:00:00'); d.setDate(d.getDate() + 1); f = ymd(d); }
      const r = document.createElement('div'); r.className = 'evt';
      r.innerHTML = `<div class="evh"><h4></h4><button type="button" class="x" aria-label="Quitar evento" onclick="this.closest('.evt').remove();calc();stale()">✕</button></div>
        <div class="evg"><label>Fecha<input class="ef" type="date" value="${f}"></label>
        <label>Hora inicio<input class="ei" type="time" value="16:00"></label><label>Hora fin<input class="eh" type="time" value="23:00"></label>
        <label>Personas<input class="ep" type="number" min="1" inputmode="numeric" placeholder="Ej. 45"></label>
        <label>Costo del evento ($)<input class="ec" type="number" min="0" inputmode="decimal" placeholder="0.00"></label></div>`;
      $('eventos').appendChild(r); if (!init) r.querySelector('.ep').focus(); calc(); stale();
    }
    const conceptos = () => [...document.querySelectorAll('.cpt')].map(r => ({ n: r.querySelector('.cn').value.trim() || 'Concepto adicional', m: num(r.querySelector('.ca').value) })).filter(c => c.m);

    function agregarConcepto() {
      const r = document.createElement('div'); r.className = 'cpt';
      r.innerHTML = '<input class="cn" type="text" placeholder="Concepto (Ej. Sillas extra)"><input class="ca" type="number" min="0" inputmode="decimal" placeholder="$0.00"><button type="button" class="x" aria-label="Quitar" onclick="this.parentNode.remove();calc();stale()">✕</button>';
      $('conceptos').appendChild(r); r.firstChild.focus();
    }

    function desglose() {
      const ev = eventos();
      const rows = [];
      ev.forEach((e, i) => rows.push([`Evento ${i + 1}: ${fecha(e.f)}, ${e.p} personas`, e.c]));
      EXTRAS.forEach(([nm], i) => { if ($('ex' + i).checked) rows.push([nm, num($('exp' + i).value)]); });
      conceptos().forEach(c => rows.push([c.n, c.m]));
      const sub = rows.reduce((s, r) => s + r[1], 0);
      let total = sub;
      const dv = num($('descuentoInput').value), pct = $('descTipo').value === '%', mot = $('descMotivo').value.trim();
      const dsc = Math.round(Math.min(pct ? sub * Math.min(dv, 100) / 100 : dv, sub) * 100) / 100;
      if (dsc > 0) { rows.push([`Descuento${pct ? ' ' + dv + '%' : ''}${mot ? ' (' + mot + ')' : ''}`, -dsc]); total = sub - dsc; }
      const fx = $('totalFijo').value.trim();
      if (fx !== '' && Math.abs(num(fx) - total) > 0.004) { rows.push(['Ajuste por precio especial pactado', num(fx) - total]); total = num(fx); }
      return { rows, total, ev };
    }

    function calc() {
      const d = desglose(), ant = Math.round(d.total * CFG.anticipo * 100) / 100;
      $('precioInput').value = mxn(d.total);
      $('resumen').innerHTML = d.rows.map(r => `<div><span>${esc(r[0])}</span><span>${mxn(r[1])}</span></div>`).join('')
        + `<div class="t"><b>Total</b><b>${mxn(d.total)}</b></div>`
        + `<div><span>Anticipo ${PCT}%</span><span>${mxn(ant)}</span></div><div><span>Saldo</span><span>${mxn(Math.round((d.total - ant) * 100) / 100)}</span></div>`;
      $('sbTotal').textContent = mxn(d.total);
      return d;
    }

    function aviso(m) { $('aviso').textContent = m; $('aviso').classList.toggle('on', !!m); if (m) $('aviso').scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    function estado(m, off) { $('pdfEstado').textContent = m; ['btnShare', 'btnDl'].forEach(i => $(i).disabled = off); }

    function contratoHTML() {
      const g = id => $(id).value.trim(), d = desglose();
      const ant = Math.round(d.total * CFG.anticipo * 100) / 100, saldo = Math.round((d.total - ant) * 100) / 100;
      const dep = mxn(g('depositoInput') === '' ? 1000 : num(g('depositoInput')));
      const hoy = new Date().toLocaleDateString('es-MX', { day:'numeric', month:'long', year:'numeric' });
      const ev = d.ev.length ? `<li><b>${d.ev.length > 1 ? 'Eventos' : 'Evento'}:</b><ul>${d.ev.map(e => `<li>${fecha(e.f)}, de ${e.i || '--:--'} a ${e.h || '--:--'} hrs, para un máximo de ${e.p} personas.</li>`).join('')}</ul>Al concluir el horario de cada evento cesará la música y los invitados deberán retirarse.</li>` : '';
      const inc = 'mesas con mantel, sillas conforme al número de personas de cada evento y 1 hielera grande';
      const sel = gr => EXTRAS.filter((x, i) => x[2] === gr && $('ex' + i).checked).map(x => x[0]);
      const accL = sel('Accesos adicionales'), accH = accL.length ? `<li><b>Áreas adicionales contratadas:</b> ${esc(accL.join(', '))}.</li>` : '';
      const eqL = sel('Equipos'), eqH = eqL.length ? `<li><b>Equipos contratados:</b> ${esc(eqL.join(', '))}.</li>` : '';
      const tipo = g('tipoEvento');
      const desg = d.rows.map(r => `<tr><td>${esc(r[0])}</td><td>${mxn(r[1])}</td></tr>`).join('');
      const banco = CFG.banco.map(r => `<tr><td>${r[0]}:</td><td>${esc(r[1])}</td></tr>`).join('');

      const cls = [
        ['OBJETO', `EL ARRENDADOR otorga en arrendamiento temporal el inmueble denominado "Quinta Bugambilia", ubicado en ${CFG.domicilio}, exclusivamente para ${tipo ? 'la celebración de su evento (' + esc(tipo) + ')' : 'la celebración del evento descrito en este contrato'}. El arrendamiento no incluye servicio de hospedaje ni pernocta. Queda prohibido subarrendar, ceder o destinar el inmueble a un fin distinto.`],
        ['FECHAS, HORARIOS Y OCUPACIÓN', `EL ARRENDATARIO usará el inmueble bajo las siguientes condiciones:<ul>${ev}${accH}${eqH}<li><b>Incluye:</b> ${inc}.</li></ul>La permanencia fuera de los horarios pactados requiere autorización previa y por escrito de EL ARRENDADOR y podrá generar un cargo adicional.`],
        ['PRECIO', `El precio total es de <b>${mxn(d.total)}</b> (${letrasMXN(d.total)}), integrado así:<table class="tb r">${desg}<tr class="tot"><td>TOTAL</td><td>${mxn(d.total)}</td></tr></table>`],
        ['ANTICIPO Y PAGO DEL SALDO', `Para reservar la fecha, EL ARRENDATARIO pagará un anticipo del ${PCT}% del precio (<b>${mxn(ant)}</b>); la fecha no queda reservada hasta recibirse dicho anticipo. El saldo (<b>${mxn(saldo)}</b>) deberá liquidarse en su totalidad antes del ingreso al inmueble; de no hacerlo, EL ARRENDADOR podrá negar el acceso sin responsabilidad, perdiendo EL ARRENDATARIO el anticipo.`],
        ['DATOS PARA PAGO', `Los pagos se realizarán a la siguiente cuenta, propiedad de EL ARRENDADOR; EL ARRENDATARIO conservará su comprobante:<table class="tb">${banco}</table>`],
        ['DEPÓSITO DE GARANTÍA, LIMPIEZA Y DAÑOS', `EL ARRENDATARIO entregará, antes de ingresar y adicionalmente al precio, un depósito de garantía de <b>${dep}</b>. EL ARRENDADOR lo devolverá dentro de los 3 días hábiles siguientes a la salida, previa revisión del inmueble. Podrán descontarse del depósito los daños, faltantes, limpieza extraordinaria o tiempo adicional de uso. Si estos exceden el depósito, EL ARRENDATARIO pagará la diferencia de inmediato. El inmueble deberá entregarse en condiciones de orden y limpieza razonables.`],
        ['USO, AFORO Y RESPONSABILIDAD POR INVITADOS', `EL ARRENDATARIO responde por los actos u omisiones de sus invitados, proveedores y demás personas que ingresen por su cuenta; los proveedores externos requieren autorización de EL ARRENDADOR. Todo exceso de ocupación no autorizado en el evento dará lugar a la rescisión inmediata del contrato, sin derecho a reembolso.`],
        ['ALBERCA, SALÓN DE JUEGOS Y ÁREAS DE RIESGO', `Los menores de edad deberán permanecer en todo momento bajo la supervisión directa de un adulto responsable designado por EL ARRENDATARIO, especialmente en la alberca y áreas acuáticas, brincolines y salón de juegos. El aforo del salón de juegos deberá controlarse estrictamente. Cualquier daño al equipo o mobiliario será a cargo de EL ARRENDATARIO.`],
        ['RESPONSABILIDAD Y REGLAMENTO', `EL ARRENDADOR no será responsable por accidentes, lesiones, enfermedades o pérdida de objetos personales ocurridos durante el evento, salvo que deriven de su dolo, de su culpa grave o de condiciones del inmueble que le sean imputables. EL ARRENDATARIO firmará el Reglamento de Uso y Hospedaje antes de ingresar y lo dará a conocer a sus invitados.`],
        ['CANCELACIONES', `Si EL ARRENDATARIO cancela por escrito: con 20 días o más de anticipación se reembolsará el 80% del anticipo; con 4 a 19 días, el 50%; con 3 días o menos, o por inasistencia, no habrá reembolso. Si EL ARRENDADOR no pudiera cumplir, o por caso fortuito o fuerza mayor que impida el uso del inmueble, se reprogramará sin costo o se devolverá íntegramente lo pagado. Las condiciones climáticas por sí solas no dan derecho a reembolso.`],
        ['PROHIBICIONES Y RESCISIÓN', `Está prohibido el uso de sustancias ilegales, armas, pirotecnia, la introducción de mascotas (salvo acuerdo previo por escrito), la venta de bebidas alcohólicas o el cobro de acceso, y el ruido excesivo fuera de los horarios permitidos. El incumplimiento facultará a EL ARRENDADOR a terminar el contrato y desalojar el inmueble de inmediato, sin reembolso y sin perjuicio de reclamar los daños causados.`],
        ['DATOS PERSONALES', `EL ARRENDATARIO autoriza el tratamiento de sus datos personales, incluida su identificación oficial, para fines de identificación, contratación y seguridad del inmueble, conforme a la legislación aplicable en materia de protección de datos personales. El aviso de privacidad está a su disposición con EL ARRENDADOR.`],
        ['LEY APLICABLE Y JURISDICCIÓN', `Para su interpretación y cumplimiento, las partes se someten a la legislación del Estado de Sonora, en especial al Código Civil para el Estado de Sonora, y a los tribunales competentes de Hermosillo, Sonora, renunciando a cualquier otro fuero que por su domicilio presente o futuro pudiera corresponderles. Las notificaciones se harán en los domicilios y teléfonos señalados en este contrato.`],
        ['ACEPTACIÓN', `Las partes declaran haber leído y comprendido este contrato, manifiestan su conformidad y lo firman en dos tantos.`]
      ];
      const ord = ['PRIMERA','SEGUNDA','TERCERA','CUARTA','QUINTA','SEXTA','SÉPTIMA','OCTAVA','NOVENA','DÉCIMA','DÉCIMA PRIMERA','DÉCIMA SEGUNDA','DÉCIMA TERCERA','DÉCIMA CUARTA'];

      let ex = EXTRAS.filter((e, i) => $('ex' + i).checked).map(e => `• Incluye servicio de: ${e[0]}.`).join('\n');
      if (g('anotacionesInput')) ex += `\n\nAnotaciones especiales (forman parte de este contrato): ${g('anotacionesInput')}`;
      ex = ex.trim() || 'Ninguno.';

      return `<h2>CONTRATO DE ARRENDAMIENTO TEMPORAL PARA EVENTO EN "QUINTA BUGAMBILIA"</h2>
        <p class="cl">En Hermosillo, Sonora, a ${hoy}, celebran este contrato, por una parte <b>${esc(CFG.arrendador)}</b>, en lo sucesivo "EL ARRENDADOR", y por la otra <b>C. ${esc(g('nombreInput'))}</b>, con identificación oficial No. <b>${esc(g('ineInput'))}</b>, domicilio en ${esc(g('domicilioInput') || '______________________')} y teléfono ${esc(g('telefonoInput') || '____________')}, en lo sucesivo "EL ARRENDATARIO". <b>DECLARAN:</b> (I) EL ARRENDADOR, que cuenta con la propiedad o las facultades para arrendar el inmueble; (II) EL ARRENDATARIO, que tiene capacidad legal, que sus datos son verdaderos y que conoce el inmueble. Con base en ello, convienen las siguientes:</p>
        ${cls.map((c, i) => `<p class="cl"><b>${ord[i]}. ${c[0]}.</b> ${c[1]}</p>`).join('')}
        <div class="cl"><b>SERVICIOS ADICIONALES Y ANOTACIONES:</b><div class="extras">${esc(ex)}</div></div>
        <div class="firmas"><div><b>EL ARRENDATARIO</b><br>${esc(g('nombreInput'))}</div><div><b>EL ARRENDADOR</b><br>${esc(CFG.arrendador)}</div></div>`;
    }

    function generar() {
      const g = id => $(id).value.trim();
      const err = !g('nombreInput') ? 'Ingresa el nombre del cliente.'
        : !g('ineInput') ? 'Ingresa la identificación oficial.'
        : !eventos().length ? 'Agrega al menos un evento.'
        : eventos().some(e => !e.f) ? 'Captura la fecha de cada evento.'
        : eventos().some(e => e.p <= 0) ? 'Captura el número de personas de cada evento.'
        : desglose().total <= 0 ? 'El total es $0.00: revisa el costo del evento y los extras.' : '';
      if (err) return aviso(err);
      aviso('');
      calc();
      $('docContrato').innerHTML = contratoHTML();
      $('contrato-wrap').hidden = false;
      const n = g('nombreInput').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]+/g, '_');
      pdfName = `Contrato_Evento_QuintaBugambilia_${n}_${eventos()[0].f}.pdf`;
      pdfBlob = null;
      estado('Preparando PDF…', true);
      setTimeout(() => $('contrato-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
      prepararPDF(++seq);
    }

    async function prepararPDF(my) {
      if (typeof html2pdf === 'undefined') return estado('No cargó el generador de PDF (revisa tu conexión). Usa Imprimir → Guardar como PDF.', true);
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:fixed;left:-9999px;top:0;width:725px;background:#fff';
      const el = $('docContrato').cloneNode(true);
      el.removeAttribute('id');
      el.style.cssText = 'width:725px;max-width:725px;margin:0;padding:0;border:0;border-radius:0';
      wrap.appendChild(el); document.body.appendChild(wrap);
      try {
        await new Promise(r => setTimeout(r, 250));
        const blob = await html2pdf().set({
          margin: [12, 12, 16, 12],
          image: { type: 'jpeg', quality: 0.95 },
          html2canvas: { scale: 1.6, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0, windowWidth: 725, width: 725 },
          jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' },
          pagebreak: { mode: ['css', 'legacy'], avoid: ['.cl', '.firmas', '.tb', 'li'] }
        }).from(el).toPdf().get('pdf').then(pdf => {
          const n = pdf.internal.getNumberOfPages(), w = pdf.internal.pageSize.getWidth(), h = pdf.internal.pageSize.getHeight();
          pdf.setFontSize(8); pdf.setTextColor(110);
          for (let i = 1; i <= n; i++) { pdf.setPage(i); pdf.text(`Quinta Bugambilia · Contrato · Página ${i} de ${n}`, w / 2, h - 7, { align: 'center' }); }
        }).outputPdf('blob');
        if (my === seq) { pdfBlob = blob; estado('PDF listo. Toca "Guardar / Compartir" y elige Archivos, Drive o WhatsApp.', false); }
      } catch (e) {
        console.error(e);
        if (my === seq) estado('No se pudo crear el PDF. Usa Imprimir → Guardar como PDF.', true);
      } finally { wrap.remove(); }
    }

    function descargar() {
      if (!pdfBlob) return;
      const u = URL.createObjectURL(pdfBlob), l = document.createElement('a');
      l.href = u; l.download = pdfName; document.body.appendChild(l); l.click(); l.remove();
      setTimeout(() => URL.revokeObjectURL(u), 60000);
    }

    async function compartir() {
      if (!pdfBlob) return;
      const f = new File([pdfBlob], pdfName, { type: 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        try { await navigator.share({ files: [f], title: 'Contrato Quinta Bugambilia' }); return; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
      descargar();
    }

    function stale() {
      if ($('contrato-wrap').hidden) return;
      seq++; pdfBlob = null;
      estado('Cambiaste datos: vuelve a generar el contrato antes de guardar el PDF.', true);
    }

    function clearForm() {
      document.querySelectorAll('.form-container input, .form-container textarea').forEach(i => {
        if (i.type === 'checkbox') i.checked = false; else i.value = i.defaultValue;
      });
      document.querySelectorAll('.form-container select').forEach(x => x.selectedIndex = 0);
      document.querySelectorAll('.cpt').forEach(r => r.remove());
      document.querySelectorAll('.evt').forEach(r => r.remove()); NP = [];
      seq++; pdfBlob = null; aviso(''); agregarEvento(true); calc();
      $('contrato-wrap').hidden = true;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ===== Inicio ===== */
    let gp = '';
    $('extras').insertAdjacentHTML('afterbegin', EXTRAS.map(([n, c, g], i) => (g !== gp ? (gp = g, `<div class="ghead">${g}</div>`) : '') +
      `<div class="extra-item"><label class="xl"><input type="checkbox" id="ex${i}"><span class="extra-label">${n}</span></label><input type="number" class="xp" id="exp${i}" value="${c}" min="0" inputmode="decimal" aria-label="Precio de ${n}"></div>`).join(''));
    const F = document.querySelector('.form-container');
    ['input', 'change'].forEach(t => F.addEventListener(t, e => {
      const id = e.target.id || '';
      if (id.startsWith('exp')) $('ex' + id.slice(3)).checked = true;
      if (/^ex\d+$/.test(id) && e.target.checked) { const x = +id.slice(2); if (EXTRAS[x][0].startsWith('Casa Principal')) EXTRAS.forEach(([m], j) => { if (j !== x && m.startsWith('Casa Principal')) $('ex' + j).checked = false; }); }
      calc(); stale();
    }));
    agregarEvento(true);
    function cotizar() {
      const d = calc(), n = $('nombreInput').value.trim(), t = $('telefonoInput').value.replace(/\D/g, '');
      if (d.total <= 0) return aviso('Aún no hay conceptos para cotizar.');
      aviso('');
      const ant = Math.round(d.total * CFG.anticipo * 100) / 100;
      const msg = `Hola${n ? ' ' + n.split(' ')[0] : ''}, esta es la cotización de tu evento en Quinta Bugambilia:\n\n` + d.rows.map(r => `• ${r[0]}: ${mxn(r[1])}`).join('\n')
        + `\n\n*Total: ${mxn(d.total)}*\nAnticipo ${PCT}% para reservar: ${mxn(ant)}\nSaldo: ${mxn(Math.round((d.total - ant) * 100) / 100)}`;
      window.open('https://wa.me/' + (t.length === 10 ? '52' + t : t) + '?text=' + encodeURIComponent(msg), '_blank');
    }
    function tema() { const r = document.documentElement, d = r.dataset.theme === 'dark' ? '' : 'dark'; d ? r.dataset.theme = 'dark' : r.removeAttribute('data-theme'); try { localStorage.setItem('qc-tema', d); } catch (e) {} }
    try { if (localStorage.getItem('qc-tema') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}

</script>
</body>
</html>
