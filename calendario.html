<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Calendario de Disponibilidad 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --amber: #d97706;
      --amber-bg: #fef3c7;
      --red: #dc2626;
      --red-bg: #fee2e2;
      --border: #e5e7eb;
      --accent: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 1.5rem 1rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .cal-wrapper {
      width: 100%;
      max-width: 960px;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    .header-area {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .header-area h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .header-area p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    /* Leyendas de Color */
    .legend {
      display: flex;
      gap: 1.25rem;
      justify-content: center;
      align-items: center;
      margin-bottom: 1.5rem;
      padding: 0.75rem 1rem;
      background: #f8fafc;
      border-radius: 30px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 500;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-free { background: var(--green); }
    .dot-partial { background: var(--amber); }
    .dot-busy { background: var(--red); }

    /* Métricas del Mes */
    .cal-stats {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
    }

    .stat-free { background: var(--green-bg); color: var(--green); }
    .stat-partial { background: var(--amber-bg); color: var(--amber); }
    .stat-busy { background: var(--red-bg); color: var(--red); }

    /* Navegación de Meses */
    .month-nav-container {
      overflow-x: auto;
      margin-bottom: 1.5rem;
      scrollbar-width: thin;
    }

    .month-nav {
      display: flex;
      gap: 0.5rem;
      padding-bottom: 0.5rem;
    }

    .month-btn {
      padding: 0.5rem 1.1rem;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-main);
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .month-btn:hover {
      background: #f1f5f9;
    }

    .month-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    /* Grid del Calendario */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .cal-day-name {
      text-align: center;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.5rem 0;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .cal-cell {
      border: 1px solid var(--border);
      border-radius: 10px;
      min-height: 85px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #ffffff;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .cal-cell.empty {
      background: transparent;
      border: none;
    }

    .cal-cell.today {
      border: 2px solid var(--accent);
    }

    .status-indicator {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
    }
    .status-indicator.free { background: var(--green); }
    .status-indicator.partial { background: var(--amber); }
    .status-indicator.busy { background: var(--red); }

    .day-num {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-main);
      margin-top: 2px;
    }

    /* Etiquetas de Turnos */
    .session-tags {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 4px;
    }

    .session-tag {
      font-size: 0.68rem;
      font-weight: 500;
      padding: 3px 5px;
      border-radius: 4px;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag-free {
      background: var(--green-bg);
      color: var(--green);
    }

    .tag-busy {
      background: var(--red-bg);
      color: var(--red);
    }

    /* Loader */
    #calendar-wrap {
      min-height: 300px;
    }

    .loader {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    @media (max-width: 640px) {
      .cal-wrapper { padding: 1.25rem 0.75rem; }
      .cal-cell { min-height: 70px; padding: 4px; }
      .day-num { font-size: 0.8rem; }
      .session-tag { font-size: 0.62rem; padding: 2px 3px; }
    }
  </style>
</head>
<body>

<div class="cal-wrapper">
  <div class="header-area">
    <h1>Disponibilidad de Fechas 2026</h1>
    <p>Actualizado en tiempo real desde Google Sheets</p>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="dot dot-free"></div> Disponible</div>
    <div class="legend-item"><div class="dot dot-partial"></div> Parcial (Mañana u Tarde libre)</div>
    <div class="legend-item"><div class="dot dot-busy"></div> Ocupado</div>
  </div>

  <div class="month-nav-container">
    <nav class="month-nav" id="month-nav"></nav>
  </div>

  <div id="calendar-wrap">
    <div class="loader">Sincronizando fechas...</div>
  </div>
</div>

<script>
// Tu Google Sheet CSV publicado
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSTzsIJt3LZsM9IPnoaVlH2iwxTePfYaXk4yl_fQi-btNjWBaf0xj2X5kLUlVv2YxTQ5bS4kH_AKXnf/pub?gid=1275090392&single=true&output=csv';

const MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DAY_NAMES_DESKTOP = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DAY_NAMES_MOBILE = ['D','L','M','M','J','V','S'];

let calendarData = {};
let currentMonth = new Date().getMonth();
const YEAR = 2026;

// Parsea las líneas del CSV respetando comillas
function parseCSVLine(line) {
  const cols = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') inQ = !inQ;
    else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  cols.push(cur.trim());
  return cols;
}

// Parsea fecha en formato DD/MM/YYYY o números de serie de Excel
function parseDate(fechaRaw) {
  if (!fechaRaw) return null;
  let m = fechaRaw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));
  const serial = parseInt(fechaRaw);
  if (!isNaN(serial) && serial > 40000) return new Date(Date.UTC(1899,11,30) + serial * 86400000);
  return new Date(fechaRaw);
}

// Parsea el CSV ignorando automáticamente encabezados superiores
function parseCSV(text) {
  const result = {};
  const lines = text.split('\n');

  for (const line of lines) {
    const row = parseCSVLine(line);
    if (row.length < 4) continue;

    const dateObj = parseDate(row[0]);
    // Descarta encabezados o filas sin fechas válidas para 2026
    if (!dateObj || isNaN(dateObj.getTime()) || dateObj.getFullYear() !== YEAR) continue;

    const monthKey = `${YEAR}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
    const dayKey = `${monthKey}-${String(dateObj.getDate()).padStart(2, '0')}`;

    if (!result[monthKey]) result[monthKey] = {};

    // Mapea Columna C (Mañana) y Columna D (Tarde)
    result[monthKey][dayKey] = {
      manana: row[2],
      tarde: row[3]
    };
  }
  return result;
}

// Determina el estado del día según los turnos
function getStatus(dayData) {
  if (!dayData) return 'free';
  const m = (dayData.manana || '').toLowerCase().includes('ocup');
  const t = (dayData.tarde || '').toLowerCase().includes('ocup');
  if (m && t) return 'busy';
  if (m || t) return 'partial';
  return 'free';
}

// Carga de datos sin guardar en caché mediante timestamp
async function loadData() {
  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now());
    const text = await res.text();
    calendarData = parseCSV(text);
    renderNav();
    renderCalendar(currentMonth);
  } catch(e) {
    document.getElementById('calendar-wrap').innerHTML = '<div class="loader" style="color:var(--red);">Error al cargar los datos de disponibilidad.</div>';
  }
}

// Barra de meses
function renderNav() {
  const nav = document.getElementById('month-nav');
  nav.innerHTML = '';
  MONTH_NAMES.forEach((name, m) => {
    const btn = document.createElement('button');
    btn.className = 'month-btn' + (m === currentMonth ? ' active' : '');
    btn.textContent = name;
    btn.onclick = () => { currentMonth = m; renderNav(); renderCalendar(m); };
    nav.appendChild(btn);
  });
}

// Dibuja el grid del calendario
function renderCalendar(month) {
  const wrap = document.getElementById('calendar-wrap');
  const monthKey = `${YEAR}-${String(month + 1).padStart(2, '0')}`;
  const monthData = calendarData[monthKey] || {};
  const daysInMonth = new Date(YEAR, month + 1, 0).getDate();
  const firstWD = new Date(YEAR, month, 1).getDay();
  const today = new Date();

  // Contadores para las métricas del mes
  let freeCount = 0, partialCount = 0, busyCount = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const dk = `${monthKey}-${String(d).padStart(2, '0')}`;
    const st = getStatus(monthData[dk]);
    if (st === 'busy') busyCount++;
    else if (st === 'partial') partialCount++;
    else freeCount++;
  }

  let html = `
    <div class="cal-stats">
      <div class="stat-badge stat-free">Libres: ${freeCount}</div>
      <div class="stat-badge stat-partial">Parciales: ${partialCount}</div>
      <div class="stat-badge stat-busy">Ocupados: ${busyCount}</div>
    </div>
    <div class="cal-grid">
  `;

  const isLargeScreen = window.innerWidth >= 640;
  const labels = isLargeScreen ? DAY_NAMES_DESKTOP : DAY_NAMES_MOBILE;

  labels.forEach(d => html += `<div class="cal-day-name">${d}</div>`);
  for (let i = 0; i < firstWD; i++) html += `<div class="cal-cell empty"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const dk = `${monthKey}-${String(d).padStart(2, '0')}`;
    const data = monthData[dk];
    const status = getStatus(data);
    const isToday = today.getFullYear() === YEAR && today.getMonth() === month && today.getDate() === d;

    let tags = '';
    if (data) {
      if (data.manana) {
        const isOcup = data.manana.toLowerCase().includes('ocup');
        tags += `<span class="session-tag ${isOcup ? 'tag-busy' : 'tag-free'}">☀️ ${isLargeScreen ? data.manana : (isOcup ? 'Ocup' : 'Disp')}</span>`;
      }
      if (data.tarde) {
        const isOcup = data.tarde.toLowerCase().includes('ocup');
        tags += `<span class="session-tag ${isOcup ? 'tag-busy' : 'tag-free'}">🌙 ${isLargeScreen ? data.tarde : (isOcup ? 'Ocup' : 'Disp')}</span>`;
      }
    }

    html += `
      <div class="cal-cell ${isToday ? 'today' : ''}">
        <div class="status-indicator ${status}"></div>
        <div class="day-num">${d}</div>
        <div class="session-tags">${tags}</div>
      </div>
    `;
  }

  wrap.innerHTML = html + '</div>';
}

window.addEventListener('resize', () => renderCalendar(currentMonth));
loadData();
</script>

</body>
</html>
